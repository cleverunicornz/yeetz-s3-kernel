name: ci-dev

# Manual, agent-invocable gate runner. Never auto-triggers.
# Usage: gh workflow run ci-dev.yml -f ref=<branch-or-sha> -f task=<task> [-f runner=<runner>]
# Witness rule: gate claims cite this run's URL, not local attestations.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch or SHA to verify"
        required: true
      task:
        description: "check | clippy | build | nextest | gates | qualify | kernel-rigs | real-s3"
        required: false
        default: "clippy"
      runner:
        description: "org-ci-linux-x64 (default) | runner-<host>-<nn> for a specific bare-metal runner"
        required: false
        default: "org-ci-linux-x64"
        type: choice
        options:
          - org-ci-linux-x64
          - runner-61w-01
          - runner-61w-02
          - runner-61w-03
          - runner-66t-01
          - runner-66t-02
          - runner-66t-03
          - runner-ju0-01
          - runner-ju0-02
          - runner-ju0-03
      cache_state:
        description: "warm (default) | cold (discard this runner's repository target before execution)"
        required: false
        default: "warm"

concurrency:
  group: ci-dev-${{ inputs.ref }}-${{ inputs.task }}-${{ inputs.runner }}-${{ inputs.cache_state }}
  cancel-in-progress: true

jobs:
  run:
    # Fork PRs never dispatch — workflow_dispatch requires write access
    # (already enforced by GitHub), belt-and-suspenders for any future trigger
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - run: /opt/gh-runners/bin/configure-rust-local-cache
      - name: reset repository target for cold qualification
        if: inputs.cache_state == 'cold'
        run: rm -rf -- "$CARGO_TARGET_DIR"
      - run: tools/test_storage_boundaries.sh
        if: inputs.task == 'gates' || inputs.task == 'qualify' || inputs.task == 'kernel-rigs' || inputs.task == 'real-s3'
      - run: tools/test_dependency_floor.sh
        if: inputs.task == 'gates' || inputs.task == 'qualify' || inputs.task == 'kernel-rigs' || inputs.task == 'real-s3'
      - run: tools/check_storage_boundaries.sh
        if: inputs.task == 'gates' || inputs.task == 'qualify' || inputs.task == 'kernel-rigs' || inputs.task == 'real-s3'
      - run: tools/check_dependency_floor.sh
        if: inputs.task == 'gates' || inputs.task == 'qualify' || inputs.task == 'kernel-rigs' || inputs.task == 'real-s3'
      - uses: taiki-e/install-action@v2
        if: inputs.task != 'clippy'
        with:
          tool: cargo-nextest
      - name: check
        if: inputs.task == 'check'
        run: cargo check --workspace --all-targets --all-features
      - name: clippy
        if: inputs.task == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: build
        if: inputs.task == 'build'
        run: cargo build --workspace --locked
      - name: nextest
        if: inputs.task == 'nextest'
        run: cargo nextest run --workspace
      - name: gates (full set)
        if: inputs.task == 'gates'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --workspace --locked
          cargo nextest run --workspace
      - name: qualify commissioned runner
        if: inputs.task == 'qualify'
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --workspace --locked
          cargo nextest run --workspace
      - name: real-s3 (Exoscale SOS ABA probe)
        if: inputs.task == 'real-s3'
        env:
          EXO_S3_KEY: ${{ secrets.EXO_S3_KEY }}
          EXO_S3_SECRET: ${{ secrets.EXO_S3_SECRET }}
          EXO_S3_BUCKET: ${{ secrets.EXO_S3_BUCKET }}
        run: cargo run --locked -p yeetz-rigs --example real_s3_aba_probe
      - name: kernel-facing durable rigs
        if: inputs.task == 'kernel-rigs'
        run: cargo run --locked -p yeetz-rigs --example streams_contracts
