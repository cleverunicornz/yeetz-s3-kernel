name: ci

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE"

# A newer run of the same pull request cancels the older one; every other
# event (main push) gets its own group (run_id) and is never cancelled.
# `.github/**` is not ignored: a workflow change runs the workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Fork PRs don't run CI — same-repo branches and main pushes only.
    # Untrusted code never executes on our runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: ci
      labels: [automation-test-s]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      # Storage-boundary invariant: the kernel closure is the only S3
      # client. Mechanical enforcement; ratchet allowlist for debt.
      - run: tools/test_storage_boundaries.sh
      - run: tools/test_dependency_floor.sh
      - run: tools/check_storage_boundaries.sh
      - run: tools/check_dependency_floor.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo nextest run --workspace
