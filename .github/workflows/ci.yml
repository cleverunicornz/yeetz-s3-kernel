name: ci

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".github/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".github/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Fork PRs don't run CI — same-repo branches and main pushes only.
    # Untrusted code never executes on our runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: org-ci-linux-x64
    steps:
      - uses: actions/checkout@v7
      - run: /opt/gh-runners/bin/configure-rust-local-cache
      # Storage-boundary invariant: the kernel closure is the only S3
      # client. Mechanical enforcement; ratchet allowlist for debt.
      - run: tools/test_storage_boundaries.sh
      - run: tools/test_dependency_floor.sh
      - run: tools/check_storage_boundaries.sh
      - run: tools/check_dependency_floor.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo nextest run --workspace
